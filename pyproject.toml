[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpark"
version = "0.1.0"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "pyautogui>=0.9.54",
    "Pillow>=11.1.0",
    "pillow-heif>=0.18.0",
    "cryptography>=42.0.0",
    "mcp>=1.28.0",
    "prompt_toolkit>=3.0.52",
    "PyYAML>=6.0",
    "protobuf>=7.35.0",
    "claude-agent-sdk>=0.2.128,<0.3",
    "websockets>=16.0,<17",
    "tickflow>=0.1.24,<0.2",
    "tzdata>=2025.2",
]

[tool.setuptools.packages.find]
where = ["."]
namespaces = false
