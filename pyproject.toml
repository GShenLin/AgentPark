[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpark"
version = "0.1.0"
dependencies = [
    "packaging>=24.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "pywinauto>=0.6.9,<0.7; sys_platform == 'win32'",
    "windows-capture>=2.0.1,<3; sys_platform == 'win32'",
    "Pillow>=11.1.0",
    "pillow-heif>=0.18.0",
    "cryptography>=42.0.0",
    "mcp>=1.28.0,<2",
    "jsonschema>=4.20,<5",
    "prompt_toolkit>=3.0.52",
    "PyYAML>=6.0",
    "protobuf>=7.35.0",
    "claude-agent-sdk>=0.2.128,<0.3",
    "websockets>=16.0,<17",
    "aiortc>=1.15.0,<2",
    "tickflow>=0.1.24,<0.2",
    "tzdata>=2025.2",
    "lancedb>=0.29.2,<0.30; sys_platform != 'android'",
    "pyarrow>=16,<24; sys_platform != 'android'",
    "jieba>=0.42.1,<0.43",
    "pypdfium2>=5.13,<6; sys_platform != 'android'",
    "pypdf>=6,<7; sys_platform == 'android'",
    "httpx>=0.27,<1",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1.5,<4",
    "xlrd>=2.0.1,<3",
    "defusedxml>=0.7.1,<1",
]

[tool.setuptools.packages.find]
where = ["."]
namespaces = false
