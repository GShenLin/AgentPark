map $http_upgrade $agentpark_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name 203.0.113.10;
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }
    location / {
        return 301 https://203.0.113.10$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 203.0.113.10;
    ssl_certificate /var/lib/agentpark-tls/fullchain.pem;
    ssl_certificate_key /var/lib/agentpark-tls/server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $agentpark_connection_upgrade;
        proxy_read_timeout 3700s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
